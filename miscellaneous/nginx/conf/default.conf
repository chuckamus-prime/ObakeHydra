server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # basic gzip so we're not shipping totally naive static-file config
    gzip on;
    gzip_types text/css text/plain text/javascript application/javascript application/json;

    # health endpoint, per this repo's convention: any service should
    # expose /api/health returning a 200 so it can be checked/probed.
    location /api/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
