[supervisord]
nodaemon=true
user=root

; php-fpm actually executes the PHP code. nginx (below) is the only thing
; exposed on port 80 - php-fpm just listens on 127.0.0.1:9000 for nginx to
; talk to over fastcgi.
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; nginx is the only process actually listening on a port that's exposed
; outside the container. It serves static files directly and forwards
; anything ending in .php to php-fpm above.
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
