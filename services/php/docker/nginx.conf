server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    gzip on;
    gzip_types text/css text/plain application/json application/javascript;

    # health endpoint, per this repo's convention: any service should
    # expose /api/health returning a 200 so it can be checked/probed.
    location /api/health {
        try_files $uri /api/health.php;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # hand anything ending in .php to php-fpm, which is running
    # alongside nginx in this same container (see supervisord.conf)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # never serve dotfiles
    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
