# docker compose file for the project
#
# Usage: docker-compose up
#        docker-compose up -d
#        docker-compose down
#        docker-compose build

version: '3.8'

services:
  # our app services below:
  php:
    build:
      context: ./services/php
      dockerfile: Dockerfile
    image: php-svc
    ports:
      - "5020:80"
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      start_period: 10s #adjust as necessary.
      retries: 5

